# Reconstructed from E015/E016 (primary) and E008 (standby).
# Review certificate paths on the intended host before installation.
worker_processes 1;
events { worker_connections 1024; }
http {
    upstream backend_pool {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
        server 10.7.6.30:3002 max_fails=1 fail_timeout=10s;
    }
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    server {
        listen 8080;
        server_name app.dracarys.test;
        add_header X-Edge standby always;
        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {
        listen 8443 ssl;
        server_name app.dracarys.test;
        ssl_certificate /Users/meghna/dracarys-private/standby.crt;
        ssl_certificate_key /Users/meghna/dracarys-private/standby.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Edge standby always;
        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
