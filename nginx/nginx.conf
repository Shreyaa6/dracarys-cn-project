worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend_pool {
        server 10.7.22.237:3001;
        server 10.7.23.235:3002;
    }

    server {
        listen 8080;
        server_name app.dracarys.test api.dracarys.test;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8443 ssl;
        server_name app.dracarys.test;

        ssl_certificate     /usr/local/etc/nginx/certs/app.dracarys.test.crt;
        ssl_certificate_key /usr/local/etc/nginx/certs/app.dracarys.test.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
